<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO app</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/index.js" type="module"></script>

    <script>
      
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'pixel': ['Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
      .gradient-bg {
        background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
      }
      </style>
</head>
<body class="min-h-screen gradient-bg p-4 sm:p-6 md:p-8 font-pixel">
    <div class="w-full">
        <!-- Header -->
        <header class="mb-6 sm:mb-8 text-center">
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold mb-2 sm:mb-4 text-white drop-shadow-[0_0_10px_rgba(0,0,0,0.8)] tracking-wider" id="appTitle">
                Hey Iris
            </h1>
        </header>

        <!-- Folder Creation Button -->
        <div class="mb-4 flex justify-center">
            <button 
                id="createFolderBtn" 
                class="px-4 sm:px-6 py-2 sm:py-3 bg-gradient-to-b from-purple-400 to-purple-600 border-2 border-black rounded-md font-bold text-white text-sm sm:text-base shadow-[4px_4px_0px_0px_rgba(0,0,0,0.3)] hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,0.3)] hover:translate-x-[2px] hover:translate-y-[2px] transition-all active:shadow-none active:translate-x-[4px] active:translate-y-[4px] uppercase tracking-wider"
            >
                + New Folder
            </button>
        </div>

        <!-- Folders Container (Horizontal Scroll) -->
        <main class="folders-container">
            <div id="foldersList" class="flex gap-4 overflow-x-auto pb-4" style="scrollbar-width: thin;">
                <!-- Folders will be added here -->
            </div>
        </main>
    </div>
</body>
</html>
